name: NEXUS CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Compile and run Scala tests
        working-directory: Development
        run: sbt -batch clean test package
      - name: Check sample and producer syntax
        run: |
          python3 Real_Time_Streaming/scripts/check_sample.py
          python3 -m py_compile Real_Time_Streaming/producer/replay_events.py Real_Time_Streaming/scripts/check_sample.py
      - name: Validate Compose and producer image
        working-directory: Real_Time_Streaming
        run: |
          docker compose config -q
          docker build -f docker/Dockerfile.producer -t nexus-producer:ci .
      - name: Build streaming image
        working-directory: Real_Time_Streaming
        run: docker build -f docker/Dockerfile.streaming -t nexus-streaming:ci .
